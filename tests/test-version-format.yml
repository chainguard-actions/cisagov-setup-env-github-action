---
name: Test version output formats are valid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert go-version looks like a version number
        env:
          ACTUAL: ${{ steps.action.outputs.go-version }}
        run: |
          echo "go-version: $ACTUAL"
          # Should match major.minor (e.g. "1.21") or major.minor.patch (e.g. "1.21.0")
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: go-version '$ACTUAL' does not look like a version number"
            exit 1
          fi
          echo "PASS: go-version=$ACTUAL"
      - name: Assert python-version looks like a version number
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "python-version: $ACTUAL"
          # Should match major.minor (e.g. "3.11") or major.minor.patch
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: python-version '$ACTUAL' does not look like a version number"
            exit 1
          fi
          echo "PASS: python-version=$ACTUAL"
      - name: Assert terraform-version looks like a version number
        env:
          ACTUAL: ${{ steps.action.outputs.terraform-version }}
        run: |
          echo "terraform-version: $ACTUAL"
          # Should match major.minor.patch (e.g. "1.5.7")
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: terraform-version '$ACTUAL' does not look like a version number"
            exit 1
          fi
          echo "PASS: terraform-version=$ACTUAL"
      - name: Assert action-version looks like a version number
        env:
          ACTUAL: ${{ steps.action.outputs.action-version }}
        run: |
          echo "action-version: $ACTUAL"
          # Should match vX.Y.Z or X.Y.Z
          if ! echo "$ACTUAL" | grep -qE '^v?[0-9]+\.[0-9]+'; then
            echo "FAIL: action-version '$ACTUAL' does not look like a version number"
            exit 1
          fi
          echo "PASS: action-version=$ACTUAL"
      - name: Assert packer-version looks like a version number
        env:
          ACTUAL: ${{ steps.action.outputs.packer-version }}
        run: |
          echo "packer-version: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: packer-version '$ACTUAL' does not look like a version number"
            exit 1
          fi
          echo "PASS: packer-version=$ACTUAL"
