name: Test version output formats
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert go-version matches major.minor format
        env:
          ACTUAL: ${{ steps.action.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: go-version '$ACTUAL' does not match expected version format"
            exit 1
          fi
          echo "PASS: go-version=$ACTUAL"
      - name: Assert python-version matches major.minor format
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: python-version '$ACTUAL' does not match expected version format"
            exit 1
          fi
          echo "PASS: python-version=$ACTUAL"
      - name: Assert terraform-version matches semver format
        env:
          ACTUAL: ${{ steps.action.outputs.terraform-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: terraform-version '$ACTUAL' does not match expected semver format"
            exit 1
          fi
          echo "PASS: terraform-version=$ACTUAL"
      - name: Assert action-version matches semver format
        env:
          ACTUAL: ${{ steps.action.outputs.action-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: action-version '$ACTUAL' does not match expected semver format"
            exit 1
          fi
          echo "PASS: action-version=$ACTUAL"
      - name: Assert packer-version matches semver format
        env:
          ACTUAL: ${{ steps.action.outputs.packer-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: packer-version '$ACTUAL' does not match expected semver format"
            exit 1
          fi
          echo "PASS: packer-version=$ACTUAL"
