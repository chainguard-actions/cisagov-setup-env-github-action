---
name: Test basic usage - setup-env outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert action-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.action-version }}
        run: |
          echo "action-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: action-version output is empty"
            exit 1
          fi
          echo "PASS: action-version=$ACTUAL"
      - name: Assert python-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$ACTUAL"
      - name: Assert go-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.go-version }}
        run: |
          echo "go-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version=$ACTUAL"
      - name: Assert terraform-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.terraform-version }}
        run: |
          echo "terraform-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: terraform-version output is empty"
            exit 1
          fi
          echo "PASS: terraform-version=$ACTUAL"
