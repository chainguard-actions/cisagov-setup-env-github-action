name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert action-version output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.action-version }}
        run: |
          echo "action-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: action-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert go-version output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.go-version }}
        run: |
          echo "go-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert python-version output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert terraform-version output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.terraform-version }}
        run: |
          echo "terraform-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: terraform-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert packer-version output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.packer-version }}
        run: |
          echo "packer-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: packer-version output is empty"
            exit 1
          fi
          echo "PASS"
